[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseops-sdk"
version = "0.1.0"
description = "PulseOps AI — lightweight telemetry SDK for FastAPI applications"
requires-python = ">=3.11"
dependencies = [
    # httpx for async, non-blocking telemetry delivery
    "httpx>=0.27.0",
    # starlette types for ASGI middleware compatibility
    "starlette>=0.37.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pulseops_sdk*"]
