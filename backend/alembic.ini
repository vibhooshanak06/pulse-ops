# Alembic configuration file.
# The sqlalchemy.url is intentionally left empty here.
# We override it dynamically in alembic/env.py using our Settings object
# so the database URL always comes from the .env file, never hardcoded.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Leave empty — overridden in env.py
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
